<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>DupTrace</title>
    <meta
      name="description"
      content="DupTrace — evidence-first operations investigation. Trace the signal, find the cause."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <!--
      Theme bootstrap. Runs before first paint so there is no light/dark flash.
      Resolves the saved preference, else the OS preference. The stylesheet also
      carries a prefers-color-scheme fallback, so system dark still works if this
      script is blocked or JavaScript is disabled.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("duptrace.theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div class="app" id="app">
      <!-- Dims the surface behind an open drawer on narrow viewports. -->
      <div class="scrim" id="scrim" hidden></div>

      <!-- ───────────────────────── Left rail ───────────────────────── -->
      <aside class="rail" id="rail" aria-label="Investigations">
        <div class="rail__head">
          <span class="brand">
            <span class="brand__mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" focusable="false">
                <path
                  d="M2 13h4l2.4-7 3.3 13 2.3-9 1.7 5H22"
                  stroke="currentColor"
                  stroke-width="1.9"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            <span class="brand__name">DupTrace</span>
          </span>
          <button
            type="button"
            class="icon-btn rail__close"
            id="railClose"
            aria-label="Close navigation"
          ></button>
        </div>

        <div class="rail__new">
          <button type="button" class="newbtn" id="newInvestigation">
            <span class="newbtn__icon" aria-hidden="true"></span>
            <span>New investigation</span>
          </button>
        </div>

        <nav class="rail__nav" aria-label="Recent investigations">
          <p class="rail__eyebrow" id="recentLabel">Recent</p>
          <ul class="invlist" id="investigationList" aria-labelledby="recentLabel"></ul>
          <p class="invlist__empty" id="investigationEmpty">
            No investigations yet. Ask a question to begin.
          </p>
        </nav>

        <div class="rail__foot">
          <button
            type="button"
            class="icon-btn theme-toggle"
            id="themeToggle"
            aria-label="Switch to dark mode"
            title="Switch to dark mode"
          >
            <span class="theme-toggle__icon" id="themeIcon" aria-hidden="true"></span>
          </button>
        </div>
      </aside>

      <!-- ─────────────────────── Center workspace ───────────────────── -->
      <main class="workspace">
        <header class="topbar">
          <button
            type="button"
            class="icon-btn topbar__menu"
            id="menuToggle"
            aria-label="Open navigation"
            aria-controls="rail"
            aria-expanded="false"
          ></button>

          <div class="topbar__title">
            <h1 class="topbar__name" id="workspaceTitle">New investigation</h1>
            <p class="topbar__sub" id="workspaceSub">
              Evidence-first incident investigation
            </p>
          </div>

          <div class="status" role="status" aria-live="polite">
            <span class="status__dot" data-state="ready" aria-hidden="true"></span>
            <span class="status__label" id="statusLabel">Ready</span>
          </div>

          <button
            type="button"
            class="icon-btn topbar__inspector"
            id="inspectorToggle"
            aria-label="Hide investigation context"
            aria-controls="inspector"
            aria-expanded="true"
          ></button>
        </header>

        <section
          class="conversation"
          id="conversation"
          aria-label="Investigation conversation"
          aria-live="polite"
          tabindex="-1"
        >
          <noscript>
            <p class="noscript">
              DupTrace needs JavaScript enabled to run the investigation interface.
            </p>
          </noscript>
        </section>

        <form class="composer" id="composer" aria-label="Ask DupTrace a question">
          <label class="composer__label" for="composerInput">Ask DupTrace</label>
          <div class="composer__field">
            <textarea
              id="composerInput"
              class="composer__input"
              name="message"
              rows="1"
              autocomplete="off"
              spellcheck="true"
              enterkeyhint="send"
              placeholder="Ask about your services, incidents, deployments, or events…"
              aria-describedby="composerHint"
            ></textarea>
            <button
              type="submit"
              class="composer__send"
              id="sendButton"
              aria-label="Send message"
            >
              <svg
                class="composer__send-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M12 20V5M6 11l6-6 6 6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span class="composer__spinner" aria-hidden="true"></span>
            </button>
          </div>
          <p class="composer__hint" id="composerHint">
            Press Enter to send, Shift + Enter for a new line.
          </p>
        </form>
      </main>

      <!-- ───────────────────────── Inspector ────────────────────────── -->
      <aside class="inspector" id="inspector" aria-label="Investigation context">
        <div class="inspector__head">
          <p class="inspector__eyebrow">Context</p>
          <button
            type="button"
            class="icon-btn inspector__close"
            id="inspectorClose"
            aria-label="Hide investigation context"
          ></button>
        </div>
        <div class="inspector__body" id="inspectorBody"></div>
      </aside>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
